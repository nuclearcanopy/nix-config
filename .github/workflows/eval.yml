name: nix eval

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.IDENTITY_DEPLOY_KEY }}

      - name: trust github.com host key
        run: ssh-keyscan github.com >> ~/.ssh/known_hosts

      - uses: DeterminateSystems/nix-installer-action@v14

      - name: eval kuraokami
        run: nix eval .#nixosConfigurations.kuraokami.config.system.build.toplevel.drvPath

      - name: eval nidhoggr
        run: nix eval .#nixosConfigurations.nidhoggr.config.system.build.toplevel.drvPath

      - name: eval homeserver
        run: nix eval .#nixosConfigurations.homeserver.config.system.build.toplevel.drvPath
